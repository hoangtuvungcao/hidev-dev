name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Code Linting
      run: npm run lint

    - name: TypeScript Compile Check
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm test

    - name: Build Next.js Application
      run: npm run build
      env:
        JWT_SECRET: ci_test_secret_key_123456789
        NEXT_TELEMETRY_DISABLED: 1
